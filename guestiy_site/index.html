<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestiy | Geliştirici Profili</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="profile-card">
        <div class="banner"></div>
        <div class="avatar-container">
            <div class="avatar">
                <img src="https://i.imgur.com/6Vv6HqO.png" alt="Guestiy Avatar"> <div class="status-indicator"></div>
            </div>
            <div class="badges">
                <i class="fa-brands fa-discord" title="Discord Kullanıcısı"></i>
                <i class="fa-solid fa-code" title="Geliştirici"></i>
            </div>
        </div>

        <div class="user-info">
            <h1>Guestiy <span class="tag">#0001</span></h1>
            <p class="custom-status">"Kodluyorum, o halde varım." 💻</p>
            <div class="divider"></div>
            
            <div class="about-section">
                <h3>HAKKINDA</h3>
                <p>Merhaba, ben Guestiy. Yazılım geliştirme ve modern web tasarımları üzerine çalışıyorum.</p>
                
                <ul class="info-list">
                    <li><i class="fa-solid fa-calendar-days"></i> <strong>Katılım:</strong> 15 Mayıs 2026</li>
                    <li><i class="fa-solid fa-gamepad"></i> <strong>Hobiler:</strong> Oyun Geliştirme, Siber Güvenlik, Müzik</li>
                </ul>
            </div>

            <div class="skills-section">
                <h3>YETENEKLER</h3>
                <div class="skills-container">
                    <span class="skill python"><i class="fa-brands fa-python"></i> Python</span>
                    <span class="skill cpp"><i class="fa-solid fa-c"></i> C++</span>
                    <span class="skill html"><i class="fa-brands fa-html5"></i> HTML/CSS</span>
                </div>
            </div>

            <div class="music-section">
                <audio id="bgMusic" loop>
                    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                </audio>
                <button id="musicToggle" class="music-btn" onclick="toggleMusic()">
                    <i class="fa-solid fa-play"></i> Arka Plan Müziği
                </button>
            </div>

            <div class="divider"></div>

            <div class="counter-section">
                <h3>PROFİL GÖRÜNTÜLENME</h3>
                <img src="https://profile-counter.glitch.me/guestiy_site/count.svg" alt="Görüntülenme Sayacı">
            </div>
        </div>
    </div>

    <script>
        var music = document.getElementById("bgMusic");
        var btn = document.getElementById("musicToggle");
        var isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Arka Plan Müziği';
                btn.classList.remove('playing');
            } else {
                music.play();
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> Çalıyor...';
                btn.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
